id: scene_007
type: map
time: { start: 48.5, end: 58.0 }  # оценка, пересчитать по озвучке
script: "Держите эту деталь в голове: страну, которая станет сверхдержавой, основали люди, которых Европа выбросила."
storyboard:
  variants:
    - "Люди сходят на берег и становятся заливкой колоний; отъезд к той же наклонной карте"
    - "Силуэты складываются в контур будущих США"
    - "Лопата в землю → дерево → карта"
    - "Возврат к открытке из 001"
  chosen: 1
  reason: "Замыкает нить в той же рамке, что и 002"
  transition_in: "берег из дымки"
  transition_out: "конец фрагмента, финальный кадр статичен"
  risk: "Морфинг «фигурка → капля заливки» читается как замысел, а не баг"
cast:
  tier1: ["narrator"]
  tier2: []
  tier3: ["colonists"]
  assumptions:
    - "Каст подтверждён пользователем: ведущий в кадре (облик концепта №3, костюм XVII в.)"
on_screen_text:
  - { kind: title, text: "Отвергнутые — основатели", at: 55.3, action: "выписывается пером, держится до конца" }
camera:
  path: "подъём с берега в карту, длинный отъезд с замедлением"
  motion_blur: true
  dof: false
sound:
  music: "кульминация на волне заливки, разрешение в одну ноту"
  sfx: ["сходни", "капли краски", "скрип пера"]
  sync:
    - { accent: 52.0, event: "волна заливки колоний — кульминация" }
notes: "Заливка — цвет колоний #FF6A5E (оттенок Англии). Допущение: область заливки — условная схема роста английских колоний вдоль побережья до XVIII в., а не границы 1620-х"
