id: scene_002
type: map
time: { start: 7.0, end: 19.0 }  # оценка, пересчитать по озвучке
script: "В семнадцатом веке Европа выдавливала из себя лишних: тех, кому не хватило земли, кому не хватило денег, и главное — тех, кому не хватило места в единственно верной церкви."
storyboard:
  variants:
    - "Наклонная карта-стол: три груза-пиктограммы кренят Европу, фигурки соскальзывают к Англии"
    - "Пресс сжимает контур Европы, люди выдавливаются в Атлантику"
    - "Европа-сито"
    - "Три колонки со счётчиками"
  chosen: 1
  reason: "Прямое воплощение нити; третья причина — самый сильный крен"
  transition_in: "подъём камеры из гавани"
  transition_out: "шпиль растёт → шпиль собора (match cut, 003)"
  risk: "Крен карты и соскальзывание 40–60 фигурок читаются; подписи не дрожат — ПРОБА"
cast:
  tier1: []
  tier2: []
  tier3: ["europe_crowd"]
  assumptions:
    - "Каст подтверждён пользователем: ведущий в кадре (облик концепта №3, костюм XVII в.)"
on_screen_text:
  - { kind: medallion, text: "XVII век", at: 7.0, action: "медальон с весом, карта прогибается" }
camera:
  path: "общий план Европы, tilt 12°, дрейф на запад, толчки на грузах"
  motion_blur: true
  dof: false
sound:
  music: "вступает основная тема: виола да гамба, лютня, приглушённый барабан"
  sfx: ["дерево — межевой столб", "бумага с печатью — расписка", "колокол — шпиль", "шорох скольжения фигурок"]
  sync:
    - { accent: 9.5, event: "столб на «земли»" }
    - { accent: 11.5, event: "расписка на «денег»" }
    - { accent: 14.5, event: "шпиль на «церкви» — главный удар" }
notes: "Снимок границ ≈1600 г. (historical-basemaps); Шотландия — отдельное королевство"
