# Экранный текст: термины, имена, даты.
# status: verified — общеизвестный факт, сверен; check — проверить по источнику до сборки.

terms:
  - text: "XVII век"
    use: "медальон эпохи, сцена 002"
    status: verified
  - text: "Англиканская церковь"
    sub: "глава — монарх"
    note: >
      Акт о супрематии 1534 г. (Генрих VIII) сделал короля главой церкви;
      Акт 1559 г. (Елизавета I) — «верховный правитель». Формулировка сценария
      «собственность короля» — риторика рассказчика, на экран её не выводим.
    status: verified
  - text: "Пуритане"
    sub: "очистить церковь изнутри"
    status: verified
  - text: "Сепаратисты"
    sub: "уйти из церкви совсем"
    note: "Пилигримы «Мэйфлауэра» — сепаратисты"
    status: verified
  - text: "Атлантический океан"
    use: "подпись моря на карте"
    status: verified

places:
  - { text: "Лондон", type: capital, coords: [-0.13, 51.51], status: verified }
  - { text: "Плимут", note: "английский порт отплытия «Мэйфлауэра»", coords: [-4.14, 50.37], status: verified }
  - { text: "Джеймстаун", date: "1607 г.", coords: [-76.78, 37.21], note: "первое постоянное английское поселение", status: verified }
  - { text: "Плимутская колония", date: "1620 г.", coords: [-70.67, 41.96], status: verified }

dates:
  - text: "1607 г."
    event: "основан Джеймстаун (Вирджиния)"
    status: verified
  - text: "1620 г."
    event: "«Мэйфлауэр»: отплыл из Плимута 6 сентября, у мыса Код 9 ноября (≈ 66 дней)"
    status: verified
    note: >
      На самом «Мэйфлауэре» в пути умер 1 пассажир, около половины — в первую зиму
      уже на берегу. Поэтому его НЕ используем как иллюстрацию «смерти в пути» (сцена 005).

groups:   # сцена 006 — одно слово на группу, это термины, а не фраза из озвучки
  - "Крестьяне"
  - "Диссиденты"
  - "Авантюристы"
  - "Должники"
  - "Преступники"   # высылка осуждённых в колонии — с XVII в., массово после 1718 г.

to_check:
  - "Типичная длительность перехода через Атлантику в XVII в. (часто пишут 6–12 недель) — нужен источник, иначе цифру на экран не выводим."
