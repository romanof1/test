<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>Кто плыл через океан</title>
<style>
@font-face{font-family:"PT Serif";font-weight:400;src:url(../assets/fonts/PTSerif-Regular.ttf)}
@font-face{font-family:"PT Serif";font-weight:700;src:url(../assets/fonts/PTSerif-Bold.ttf)}
@font-face{font-family:"Montserrat";font-weight:500;src:url(../assets/fonts/Montserrat-Medium.ttf)}
@font-face{font-family:"Montserrat";font-weight:700;src:url(../assets/fonts/Montserrat-Bold.ttf)}
@font-face{font-family:"Montserrat";font-weight:800;src:url(../assets/fonts/Montserrat-ExtraBold.ttf)}
html,body{margin:0;background:#111}canvas{display:block}
</style></head><body>
<canvas id="c" width="1920" height="1080"></canvas>
<script src="geo.js"></script>
<script src="core.js"></script>
<script src="character.js"></script>
<script src="map.js"></script>
<script src="common.js"></script>
<script src="scene1.js"></script>
<script src="scene2.js"></script>
<script src="scene3.js"></script>
<script src="scene4.js"></script>
<script src="scene5.js"></script>
<script src="scene6.js"></script>
<script src="scene7.js"></script>
<script src="film.js"></script>
<script>
const cv = document.getElementById('c'), cx = cv.getContext('2d');
window.READY = (async () => {
  await Promise.all(['700 20px "PT Serif"','400 20px "PT Serif"','800 20px "Montserrat"','700 20px "Montserrat"','500 20px "Montserrat"'].map(f => document.fonts.load(f, 'Ёё')));
  mapInit(); return true;
})();
window.frame = (t) => renderAt(cx, t);
// превью в браузере: ?t=12.3 или автопроигрывание
const q = new URLSearchParams(location.search);
if (!navigator.webdriver) window.READY.then(() => { let t0 = performance.now() - (+q.get('t') || 0) * 1000; const loop = () => { const t = ((performance.now() - t0) / 1000) % DURATION; frame(t); requestAnimationFrame(loop); }; loop(); });
</script>
</body></html>
